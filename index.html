const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(D.sal), iterations: D.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const zip = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv), additionalData: new TextEncoder().encode(D.v) }, chave, b64(D.ct));
  return new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const m = document.getElementById("m"), b = document.getElementById("b"), campo = document.getElementById("s");
  b.disabled = true; m.textContent = "Abrindo...";
  let html;
  try { html = await abrir(campo.value.trim()); }
  catch (_) { m.textContent = "Senha incorreta."; b.disabled = false; campo.select(); return; }
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("dash-token:" + campo.value.trim()));   // token do assistente: só o hash, nunca a senha
  try { sessionStorage.setItem("dashToken", [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join("")); if (D.px) sessionStorage.setItem("dashProxy", D.px); } catch (_) {}
  document.open(); document.write(html); document.close();
});
